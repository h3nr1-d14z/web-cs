name: web-cs

# Two long-running services + one setup job sharing a single volume:
#
#   assets  → SteamCMD downloads Valve's CS 1.6 files once, trims them, and
#             writes game.zip + valve/ + cstrike/ into the `assets` volume.
#   game    → Xash3D dedicated server (i386) with ReGameDLL, reads the volume.
#   web     → static client + WebSocket↔UDP bridge, the only published port.
#
# Players only ever talk to `web`. UDP never leaves the Docker network, which is
# why this works over NetBird (a WireGuard mesh that carries TCP fine but would
# need extra work for direct UDP peer traffic).
#
# Mọi service khai báo `dns:` công cộng: VPN kiểu NetBird ghi đè
# /etc/resolv.conf của host, khiến container nhận 127.0.0.1/::1 cho tên công
# cộng — SteamCMD (job assets) và YaPB (tải graph map) sẽ chết vì "offline".
# `dns:` chỉ đổi upstream cho query ra ngoài; tên service nội bộ (game, web) vẫn
# do DNS nội bộ của Docker trả lời.
#
# 8.8.8.8 đứng trước 1.1.1.1: Steam CDN dùng GeoDNS, và trên mạng của mình
# Cloudflare trả một edge Akamai khác vùng (23.208.x) bị RST ngay sau
# ClientHello, trong khi Google trả edge đúng (183.80.x). glibc chỉ hỏi nameserver
# kế tiếp khi nameserver đầu *im lặng*, nên thứ tự quyết định.

services:
  assets:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: docker/assets.Dockerfile
    image: web-cs-assets:latest
    dns: [8.8.8.8, 1.1.1.1]
    environment:
      HLDS_APP_ID: "90"
    volumes:
      - assets:/out

  game:
    build:
      context: .
      dockerfile: docker/game.Dockerfile
      platforms:
        - linux/386
    image: web-cs-game:latest
    platform: linux/386
    dns: [8.8.8.8, 1.1.1.1]
    # `on-failure` (not unless-stopped) so a container that starts before the
    # assets job has run gives up after a few tries instead of restart-looping.
    restart: on-failure
    environment:
      ROOMS_API: "1"
      ROOMS_FILE: /data/rooms.json
      LISTEN_PORT: "7000"
      UDP_BASE: "27015"
      EMPTY_TTL: ${EMPTY_TTL:-1800}
      MAX_ROOMS: ${MAX_ROOMS:-8}
      RCON_PASSWORD: ${RCON_PASSWORD:-doi-mat-khau-nay}
      KZ_MODE: ${KZ_MODE:-0}
    volumes:
      - assets:/xashds
      # Preset/cvar đọc từ repo chứ không nung vào image: chỉnh "mượt" xong là
      # áp ngay cho phòng tạo sau, khỏi build lại image 3 phút.
      - ./config:/opt/config:ro
      # Danh sách phòng sống qua recreate container (trước đây /data nằm trong
      # writable layer nên mất sạch mỗi lần compose tạo lại container game).
      - rooms:/data
    expose:
      - "27015-27050/udp"
      - "7000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /xashds/cstrike/dlls/cs.so"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: web-cs-web:latest
    restart: unless-stopped
    dns: [8.8.8.8, 1.1.1.1]
    depends_on:
      - game
    environment:
      PORT: "8080"
      GAME_HOST: game
      GAME_ZIP: /data/game.zip
      PUBLIC_DIR: /app/public
      ASSETS_DIR: /data
      PRESETS_FILE: /app/config/presets.json
      GAME_MGR: http://game:7000
      RCON_PASSWORD: ${RCON_PASSWORD:-doi-mat-khau-nay}
      ACCESS_CODE: ${ACCESS_CODE:-}
      MAX_CONNECTIONS: "64"
    volumes:
      - assets:/data
      - ./config:/app/config:ro
    ports:
      # Host port is the only thing coworkers need: http://<host-ip>:27016
      - "${WEB_PORT:-27016}:8080"

volumes:
  assets:
  rooms:
