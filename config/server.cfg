// Server-side rules. Everything here is stock CS 1.6 behaviour — no gameplay
// mods — tuned for an internal LAN party.
hostname "CS 1.6 LAN Party"

// Networking
sv_lan 1
sv_region 255
rcon_enable 1
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 60
sv_minupdaterate 30
sv_timeout 30
sv_password ""
rcon_password doi-mat-khau-nay
sv_voiceenable 0
sv_allowdownload 1
sv_downloadurl ""

// Rounds / economy (classic values)
mp_autoteambalance 1
mp_limitteams 2
mp_autokick 0
mp_tkpunish 0
mp_friendlyfire 0
mp_freezetime 3
mp_roundtime 3
mp_buytime 0.75
mp_startmoney 800
mp_maxmoney 16000
mp_c4timer 35
mp_hostagepenalty 0
mp_timelimit 30
mp_maxrounds 0
mp_winlimit 0
mp_flashlight 1
mp_footsteps 1
mp_forcecamera 0
mp_forcechasecam 0
mp_fadetoblack 0
mp_spectators 1
allow_spectators 1
pausable 0

// Physics (defaults; listed so nobody "fixes" them by accident)
sv_gravity 800
sv_accelerate 5
sv_airaccelerate 10
sv_friction 4
sv_maxspeed 320

sv_log_outofband 1

// Housekeeping
sv_cheats 0
sv_alltalk 0
sv_voicecodec voice_speex
decalfrequency 60
exec listip.cfg
exec banned.cfg
